# CI：测试 + 覆盖率门禁
# 每次 push / PR 触发；覆盖率低于阈值即失败

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write            # 徽章回写需要

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: pip install pandas openpyxl coverage

      - name: 全量测试 + 覆盖率
        run: |
          coverage run --source=barter --omit=barter/tests.py -m barter.tests
          coverage report -m
          coverage xml

      - name: 覆盖率门禁（≥90%）
        run: |
          TOTAL=$(coverage report --format=total)
          echo "总覆盖率: ${TOTAL}%"
          if [ "$TOTAL" -lt 90 ]; then
            echo "::error::覆盖率 ${TOTAL}% 低于门禁 90%"
            exit 1
          fi

      - name: 更新覆盖率徽章（仅主分支 + 一个矩阵槽，避免并发推送）
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.12'
        run: |
          TOTAL=$(coverage report --format=total)
          COLOR=red
          if [ "$TOTAL" -ge 90 ]; then COLOR=green;
          elif [ "$TOTAL" -ge 80 ]; then COLOR=brightgreen;
          elif [ "$TOTAL" -ge 70 ]; then COLOR=yellow; fi
          mkdir -p badges
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${TOTAL}%\",\"color\":\"$COLOR\"}" \
            > badges/coverage.json
          git config user.name "ci-bot"
          git config user.email "ci@barter-exchange"
          git add badges/coverage.json
          git diff --cached --quiet || (git commit -m "ci: coverage $TOTAL%" && git push)

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30
