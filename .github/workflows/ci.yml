# CI：测试 + 覆盖率门禁
# 每次 push / PR 触发；覆盖率低于阈值即失败

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: pip install pandas openpyxl coverage

      - name: 全量测试 + 覆盖率
        run: |
          coverage run --source=barter --omit=barter/tests.py -m barter.tests
          coverage report -m
          coverage xml

      - name: 覆盖率门禁（≥80%）
        run: |
          TOTAL=$(coverage report --format=total)
          echo "总覆盖率: ${TOTAL}%"
          if [ "$TOTAL" -lt 80 ]; then
            echo "::error::覆盖率 ${TOTAL}% 低于门禁 80%"
            exit 1
          fi

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30
