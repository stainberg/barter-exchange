# 数据包每日生产线（数据源方案 §5/§7）
#
# 每天 UTC 06:00 采集 → 打包 → 签名 → 发布到 Releases
# 抗封锁：GitHub Pages/Releases 全球 CDN + IPFS 可选 + 数据包纯 JSON 任意渠道可传

name: datapack-daily

on:
  schedule:
    - cron: "0 6 * * *"     # UTC 06:00
  workflow_dispatch: {}      # 允许手动触发

permissions:
  contents: write            # 发布 Release 需要

jobs:
  build-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 采集 + 构建数据包
        run: |
          python pipeline/collect_daily.py
          python pipeline/build_pack.py

      - name: 提交数据包到公开历史（信任根：git 历史绑定）
        run: |
          git config user.name "datapack-bot"
          git config user.email "bot@barter-exchange"
          git add dist/ data/raw/
          git commit -m "datapack $(date -u +%Y-%m-%d)" || echo "无变更"
          git push

      - name: 捕获绑定 commit（写入数据包元信息）
        id: bind
        run: |
          COMMIT=$(git rev-parse HEAD)
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          # 重新打包以嵌入真实绑定 commit（自指哈希不可行，
          # 故绑定的是"触发本次构建的代码 commit"，包文件本身在历史中）
          python pipeline/build_pack.py
          git add dist/ && git commit -m "bind: $COMMIT" || true
          git push

      - name: 签名数据包（可选层，见 docs/DATA_SOURCES.md）
        env:
          PACK_SIGNING_KEY: ${{ secrets.PACK_SIGNING_KEY }}
        run: |
          pip install pynacl
          python pipeline/sign_pack.py

      - name: OpenTimestamps 锚定（保险丝层，零成本）
        continue-on-error: true    # 日历服务器不可达不阻塞主流程
        run: |
          pip install opentimestamps
          python pipeline/anchor_ots.py
          python pipeline/anchor_ots.py --upgrade || true
          git add dist/*.ots 2>/dev/null
          git commit -m "ots: anchor receipts" || true
          git push

      - name: 自验：签名可验证 + 引擎可加载
        run: |
          python pipeline/verify_pack.py
          python -m barter.tests

      - name: 发布到 Releases（带日期 tag）
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pack-${{ steps.date.outputs.date }}
          name: 数据包 ${{ steps.date.outputs.date }}
          files: dist/datapack-${{ steps.date.outputs.date }}.json

      - name: 更新 latest 指针（客户端固定拉这个）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新数据包
          files: dist/datapack-latest.json
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
